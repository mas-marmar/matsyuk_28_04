<h1>Книги автора: {{ author_name }}</h1>

{% if books %}
    <ul>
        {% for book in books %}
            <li>
                <a href="{% url 'book_detail' book.pk %}">
                    {{ book.title }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>У этого автора пока нет книг.</p>
{% endif %}

<p><a href="{% url 'author_list' %}">Назад к списку авторов</a></p>
