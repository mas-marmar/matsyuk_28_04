<!DOCTYPE html>
<html>
<head><title>Calc</title></head>
<body>
    <h2>Калькулятор</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="number" name="num1" step="any" required>
        <select name="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="number" name="num2" step="any" required>
        <button type="submit">OK</button>
    </form>
    {% if result is not None %}<p>Результат: {{ result }}</p>{% endif %}
    {% if error %}<p>{{ error }}</p>{% endif %}
</body>
</html>
